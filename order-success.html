<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order confirmed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="assets/css/global.css" />
  <link rel="stylesheet" href="assets/css/order-success.css" />
</head>

<body data-page="order-success">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header" id="site-header"></header>

  <main id="main">
    <section class="moment-screen">
      <canvas id="confetti-canvas"></canvas>

      <div class="moment-card">
        <div class="moment-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#C9A227" stroke-width="2.5" stroke-linecap="round"
            stroke-linejoin="round">
            <path class="moment-check-path" d="M4 12.5l5 5L20 6.5"></path>
          </svg>
        </div>

        <div class="moment-eyebrow" id="order-number">Order confirmed</div>
        <h1>You're in! 🎉</h1>
        <p class="moment-sub">Your purchase went through, your courses are unlocked and waiting for you right
          now.</p>

        <div class="order-recap" id="order-recap"></div>

        <div class="order-recap-total" id="order-recap-total"></div>

        <div class="moment-actions">
          <a class="btn btn-primary" id="start-learning-btn" href="profile.html">Start learning</a>
          <a class="btn btn-ghost" href="catalogue.html">Browse more courses</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/celebrate.js"></script>
  <script src="assets/js/order-success.js"></script>
</body>

</html>
