<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Courses — CodeCampus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="assets/css/global.css" />
  <link rel="stylesheet" href="assets/css/catalogue.css" />
</head>

<body data-page="catalogue">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header" id="site-header"></header>

  <main id="main">

    <section class="catalogue-hero">
      <div class="wrap">
        <h1>All Courses</h1>
        <p class="lede">Rand pricing, shown upfront. No surprise checkout.</p>
      </div>
    </section>

    <div class="catalogue-toolbar">
      <div class="wrap toolbar-row">
        <div class="filter-group">
          <select id="filter-language" class="filter-select" aria-label="Filter by language">
            <option value="all">Language</option>
          </select>
          <select id="filter-level" class="filter-select" aria-label="Filter by level">
            <option value="all">Level</option>
          </select>
          <select id="filter-price" class="filter-select" aria-label="Filter by price">
            <option value="all">Price</option>
            <option value="free">Free</option>
            <option value="paid">Paid</option>
          </select>
        </div>

        <div class="search-cluster">
          <label class="search-box">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8" />
              <path d="M21 21l-4.3-4.3" />
            </svg>
            <span class="visually-hidden">Search courses</span>
            <input type="search" id="course-search" placeholder="Search courses..." autocomplete="off" />
          </label>
          <button type="button" id="sort-toggle" class="icon-btn" data-sort="default" aria-label="Sort by price">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 6h16M7 12h10M10 18h4" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <section class="course-list-section">
      <div class="wrap">
        <p class="results-meta" id="results-meta" aria-live="polite"></p>

        <ul class="course-list" id="course-list" aria-live="polite"></ul>

        <div class="empty-state" id="empty-state" hidden>
          <h3>No courses match your filters</h3>
          <p>Try clearing a filter or searching a different term.</p>
        </div>
      </div>
    </section>

  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="assets/js/components.js"></script>
  <script src="assets/js/catalogue.js"></script>
</body>

</html>
